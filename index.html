/* линия в выбранном направлении: прямое — как есть,
   обратное — станции в обратном порядке, стороны платформ перевёрнуты */
function gameLine(){
  const b=LINE();
  if(APP.sel.dir!=='rev')return b;
  const S=b.stations,n=S.length;
  const gaps=[];for(let i=0;i<n-1;i++)gaps.push(S[i].dist);
  const rev=[];
  for(let i=n-1;i>=0;i--)
    rev.push({...S[i],side:S[i].side==='right'?'left':'right'});
  for(let i=0;i<n-1;i++)rev[i].dist=gaps[n-2-i];
  rev[n-1].dist=0;
  return {num:b.num,name:b.name,color:b.color,numCol:b.numCol,
          stations:rev,styles:b.styles.slice().reverse()};
}

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
function hash(n){n=Math.sin(n*127.1)*43758.545;return n-Math.floor(n);}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function fmtT(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');}
function shade(hex,k){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=clamp(r*k|0,0,255);g=clamp(g*k|0,0,255);b=clamp(b*k|0,0,255);
  return '#'+((r<<16|g<<8|b).toString(16).padStart(6,'0'));
}

function ledText(str,x,y,px,col,align){
  str=String(str).toUpperCase();
  const w=str.length*6*px-px;let sx=x;
  if(align==='center')sx=x-w/2;else if(align==='right')sx=x-w;
  ctx.fillStyle=col;
  for(const ch of str){
    const g=FONT[ch]||FONT[' '];
    for(let r=0;r<7;r++){const b=g[r];
      for(let i=0;i<5;i++)if(b&(16>>i))ctx.fillRect(sx+i*px,y+r*px,px*0.9,px*0.9);}
    sx+=6*px;
  }
}
function ledScroll(t,x,y,px,col,maxW){
  const w=t.length*6*px;
  if(w<=maxW){ledText(t,x,y,px,col);return;}
  const total=w+70,off=((APP.time||0)*26)%total;
  ctx.save();ctx.beginPath();ctx.rect(x-2,y-2,maxW+4,7*px+4);ctx.clip();
  ledText(t,x-off,y,px,col);ledText(t,x-off+total,y,px,col);ctx.restore();
}

const AU={
  ctx:null,muted:false,horn:null,mvol:1,
  init(){
    if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume();return;}
    try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
    const c=this.ctx;
    this.master=c.createGain();this.master.gain.value=this.muted?0:0.6;this.master.connect(c.destination);
    this.motorGain=c.createGain();this.motorGain.gain.value=0;
    this.filt=c.createBiquadFilter();this.filt.type='lowpass';this.filt.frequency.value=1100;
    this.o1=c.createOscillator();this.o1.frequency.value=80;
    this.o2=c.createOscillator();this.o2.frequency.value=82;
    const g2=c.createGain();g2.gain.value=0.3;
    this.o1.connect(this.filt);this.o2.connect(g2);g2.connect(this.filt);
    this.filt.connect(this.motorGain);this.motorGain.connect(this.master);
    this.o1.start();this.o2.start();
    const buf=c.createBuffer(1,c.sampleRate,c.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const src=c.createBufferSource();src.buffer=buf;src.loop=true;
    const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=2900;bp.Q.value=9;
    this.squealGain=c.createGain();this.squealGain.gain.value=0;
    src.connect(bp);bp.connect(this.squealGain);this.squealGain.connect(this.master);src.start();
    ANN.init();
  },
  tune(snd){
    if(!this.ctx)return;
    this.o1.type=snd.t1;this.o2.type=snd.t2;
    this.filt.frequency.value=snd.lp;this.mvol=snd.vol||1;
  },
  beep(f,dur,type,vol,when){
    if(!this.ctx||this.muted||!isFinite(f))return;
    const t=this.ctx.currentTime+(when||0),o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type||'square';o.frequency.value=f;
    g.gain.setValueAtTime(vol||0.15,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g);g.connect(this.master);o.start(t);o.stop(t+dur+0.05);
  },
  motor(f1,f2,v){
    if(!this.ctx)return;
    if(!isFinite(f1)||!isFinite(f2)||!isFinite(v))return;
    const t=this.ctx.currentTime;
    this.o1.frequency.setTargetAtTime(f1,t,0.08);
    this.o2.frequency.setTargetAtTime(f2,t,0.08);
    this.motorGain.gain.setTargetAtTime(this.muted?0:v*this.mvol,t,0.1);
  },
  squeal(v){
    if(!this.ctx)return;
    if(!isFinite(v))return;
    this.squealGain.gain.setTargetAtTime(this.muted?0:v,this.ctx.currentTime,0.15);
  },
  chime(){this.beep(784,0.4,'sine',0.22);this.beep(523,0.7,'sine',0.22,0.42);},
  hornStart(){
    if(!this.ctx||this.muted||this.horn)return;
    const c=this.ctx,g=c.createGain();g.gain.value=0.16;
    const o1=c.createOscillator(),o2=c.createOscillator();
    o1.type='sawtooth';o1.frequency.value=233;o2.type='sawtooth';o2.frequency.value=311;
    o1.connect(g);o2.connect(g);g.connect(this.master);o1.start();o2.start();
    this.horn={o1,o2,g};
  },
  hornStop(){
    if(!this.horn)return;const h=this.horn;this.horn=null;
    h.g.gain.setTargetAtTime(0,this.ctx.currentTime,0.05);
    setTimeout(()=>{try{h.o1.stop();h.o2.stop();}catch(e){}},250);
  },
  silence(){this.motor(40,40,0);this.squeal(0);}
};

const ANN={
  voice:null,ok:false,
  init(){

  say(text,chime=true){

    }catch(e){}
  },
  stop(){if(this.ok){try{speechSynthesis.cancel();}catch(e){}}}
};

/* ---------------------------- ГЕОМЕТРИЯ ------------------------------ */
const w2x=w=>CONFIG.HEAD_X+(w-APP.S.pos)*CONFIG.SCX;
function distNext(){const n=APP.S.stops[APP.S.stIdx+1];return n===undefined?1e9:n-APP.S.pos;}
function doorXs(){
  const a=[];
  for(let k=0;k<CONFIG.nCars;k++){
    const cs=APP.S.pos-CONFIG.carLen*(k+1);
    for(const o of[2.5,8.4,14.3])a.push(cs+o);
  }
  return a;
}
const pickDoor=()=>{const a=doorXs();return a[(Math.random()*a.length)|0];};
function doorOccupied(){
  const dxs=doorXs();
  return APP.S.pax.some(p=>(p.state==='out'||p.state==='go')&&dxs.some(x=>Math.abs(p.x-x)<1.0));
}

/* ---------------------------- ПАССАЖИРЫ ------------------------------ */
function spawnStationPax(i){
  const s=APP.S,P0=s.stops[i]-CONFIG.stopOffset,P1=P0+CONFIG.platformLen;
  s.pax=[];s.exited=false;s.miss=false;s.failPen=false;s.idleT=0;
  s.annNear=false;s.annClosed=false;
  const n=16+(Math.random()*10|0);
  for(let k=0;k<n;k++)
    s.pax.push({x:rnd(P0+6,P1-6),state:'wait',delay:rnd(0.5,6),target:0,
      v:rnd(1.3,2.0),col:pcol(),seed:Math.random(),moving:false});
  s.inside=12+(Math.random()*10|0);
}
function spawnExiting(){
  const s=APP.S;if(s.exited)return;s.exited=true;
  const dxs=doorXs(),P0=s.stops[s.stIdx]-CONFIG.stopOffset,P1=P0+CONFIG.platformLen;
  for(let i=0;i<s.inside;i++){
    const door=dxs[(Math.random()*dxs.length)|0];
    s.pax.push({x:door+rnd(-0.4,0.4),state:'in',target:door,delay:rnd(0.2,5),
      exitX:(door-P0<P1-door)?P0+6:P1-6,v:rnd(1.3,2.0),col:pcol(),seed:Math.random(),moving:false});
  }
  s.inside=0;
}
function stepTo(p,t,dt){
  const dx=t-p.x,ad=Math.abs(dx),v=p.v*dt;
  if(ad<=v||ad<0.05){p.x=t;p.moving=true;return true;}
  p.x+=Math.sign(dx)*v;p.moving=true;return false;
}
function updPax(dt){
  const s=APP.S,d=s.door,rem=[];
  for(const p of s.pax){
    p.moving=false;
    if(p.state==='in'){
      if(d.state==='open'){p.delay-=dt;
        if(p.delay<=0&&stepTo(p,p.target,dt)){p.state='out';p.target=p.exitX;}}
    }else if(p.state==='go'){
      if(d.state!=='open'&&Math.abs(p.x-p.target)>1.2){p.state='wait';p.delay=rnd(0.3,1.2);}
      else if(stepTo(p,p.target,dt))rem.push(p);
    }else if(p.state==='out'){
      if(stepTo(p,p.target,dt))rem.push(p);
    }else if(p.state==='wait'){
      if(d.state==='open'){p.delay-=dt;if(p.delay<=0){p.target=pickDoor();p.state='go';}}
    }
  }
  if(rem.length)s.pax=s.pax.filter(p=>!rem.includes(p));
}

/* ---------------------------- ДЕЙСТВИЯ ------------------------------- */
function openDoors(side){
  const s=APP.S,d=s.door,STS=s.LN.stations;
  if(!['station','end'].includes(s.phase)){showMsg('ОТКРЫТИЕ ТОЛЬКО НА СТАНЦИИ',2);return;}
  if(s.speed>0.2){showMsg('ОСТАНОВИТЕ ПОЕЗД!',2);AU.beep(250,0.3,'square',0.15);return;}
  if(d.state!=='closed'){showMsg('ДВЕРИ УЖЕ ОТКРЫТЫ',1.5);return;}
  if(side!==STS[s.stIdx].side){
    s.wrongSidePen++;s.flashWrong=1.2;
    showMsg('ЭТО НЕ СТОРОНА ПЛАТФОРМЫ!',2.5);
    addScore(CONFIG.pts.wrongSide,'НЕ ТА СТОРОНА');AU.beep(200,0.4,'square',0.2);return;
  }
  d.state='opening';d.side=side;d.stuck=false;s.blocked=false;
  AU.beep(520,0.15,'sine',0.1);
  const st=STS[s.stIdx],nx=STS[s.stIdx+1];
  const sideTxt=st.side==='right'?'направо':'налево';
  if(nx)ANN.say(`Станция ${st.name}. Следующая станция ${nx.name}. Выход ${sideTxt}.`);
  else ANN.say(`Станция ${st.name}. Конечная. Поезд следует в депо, просьба освободить вагоны.`);
}
function closeDoors(){
  const d=APP.S.door,s=APP.S;

    d.state='warn';d.warnT=0;d.buzzT=0;
    if(!s.annClosed){

        (nx?` Следующая станция ${nx.name}.`:' Поезд следует в депо.'),false);

}
function blockDoors(){

function startRec(){

function toggleMute(){

function changeLeverTo(ni){

  }

const setLeverY=y=>changeLeverTo(Math.round((y-386)/40));

/* ---------------------------- ОБНОВЛЕНИЕ ИГРЫ ------------------------ */
function update(dt){
  const s=APP.S;s.totalT+=dt;
  if(s.phase==='results')return;
  s.shake=Math.max(0,s.shake-dt*2);
  if(s.flashWrong>0)s.flashWrong=Math.max(0,s.flashWrong-dt*0.8);
  if(s.msgT>0)s.msgT-=dt;
  for(const p of s.popups)p.t+=dt;
  s.popups=s.popups.filter(p=>p.t<p.life);
  if(s.phase==='end'){
    s.evalT-=dt;
    if(s.evalT<=0){s.phase='results';AU.silence();ANN.stop();}
  }
  if(s.phase==='station'&&s.rec)s.dwell-=dt;
  if(s.phase==='run')s.runT+=dt;
  const dN=distNext(),d=s.door,STS=s.LN.stations;

  /* двери */
  if(d.state==='opening'){
    d.anim=Math.min(1,d.anim+dt/CONFIG.doorTime);
    if(d.anim>=1){d.state='open';spawnExiting();AU.beep(880,0.25,'sine',0.06);}
  }else if(d.state==='warn'){
    d.warnT+=dt;d.buzzT-=dt;
    if(d.buzzT<=0){AU.beep(760,0.2,'square',0.12);d.buzzT=0.35;}
    if(d.warnT>=CONFIG.warnTime)d.state='closing';
  }else if(d.state==='closing'){
    if(doorOccupied()){
      d.stuck=true;d.beepT-=dt;
      if(d.beepT<=0){AU.beep(500,0.15,'square',0.15);d.beepT=0.8;}
      showMsg('ПАССАЖИР В ДВЕРЯХ',0.5);
    }else{
      d.stuck=false;d.anim-=dt/CONFIG.doorTime;
      if(d.anim<=0){d.anim=0;d.state='closed';d.side=null;s.blocked=false;
        AU.beep(180,0.2,'square',0.1);}
    }
  }

  /* физика: 0–3 тяга, 4 выбег, 5–7 торможение. АРС нет. */
  const okTraction=d.state==='closed'&&s.blocked&&!s.emg;
  const T=s.T;
  let target=0;
  if(s.emg)target=-1.6;
  else if(s.lever<=3){
    if(okTraction)target=T.accel[s.lever]*(1-0.35*s.speed/T.vmax);
    else if(s.speed<0.1){
      s.lockT-=dt;
      if(s.lockT<=0){showMsg('ЗАКРОЙТЕ И ЗАБЛОКИРУЙТЕ ДВЕРИ',2);s.lockT=3;AU.beep(300,0.2,'square',0.12);}
    }
  }else if(s.lever>=5)target=T.brk[s.lever-5];
  else target=-0.05; /* ВЫБЕГ */

  const jerk=0.9;
  const da=clamp(target-s.accel,-jerk*dt,jerk*dt);
  s.accel+=da;
  if(Math.abs(target-s.accel)>0.5)s.shake=Math.max(s.shake,0.7);
  s.speed+=s.accel*dt;
  if(!isFinite(s.speed)){s.speed=0;s.accel=0;}
  if(s.speed<0){s.speed=0;s.accel=Math.max(0,s.accel);}
  if(s.speed>T.vmax*1.1)s.speed=T.vmax*1.1;
  s.pos+=s.speed*dt;
  if(!s.leftDepot&&s.speed>0.3)s.leftDepot=true;

  /* проезд знака / неустановка — только после выезда из депо */
  if(s.phase==='run'&&s.leftDepot){
    if(!s.annNear&&dN<600*CONFIG.distScale&&STS[s.stIdx+1]){
      s.annNear=true;
      ANN.say(`Уважаемые пассажиры, следующая станция ${STS[s.stIdx+1].name}.`);
    }
    if(!s.annDepot&&dN<400&&s.stIdx+1>=STS.length){
      s.annDepot=true;ANN.say('Поезд следует в депо.');
    }
    if(dN<-15&&!s.miss){
      s.miss=true;s.missPen++;addScore(CONFIG.pts.noStop,'ПРОЕЗД СТАНЦИИ');
      showMsg('ПРОЕЗД СТАНЦИИ! ОСТАНОВИТЕСЬ',3);
    }
    if(s.speed===0){
      if(dN<=25)evaluateStop(dN);
      else{
        s.idleT+=dt;
        if(s.idleT>4&&!s.failPen){
          s.failPen=true;addScore(CONFIG.pts.noStop,'НЕУСТАНОВКА');
          showMsg('НЕУСТАНОВКА! ПОДЪЕДЬТЕ К ЗНАКУ',3);
        }else if(s.msgT<=0)showMsg('ПОДТЯНИТЕСЬ К ЗНАКУ ОСТАНОВКИ',2);
      }
    }else s.idleT=0;
  }
  if(s.emg&&s.speed===0)s.emg=false;

  if(s.phase==='station'&&s.speed>0.3){s.phase='run';s.runT=0;}

  updPax(dt);

  /* приборы (декор) */
  const vT=s.accel>0.05?610:(s.speed>0.1?730:815);
  s.manV+=(vT-s.manV)*Math.min(1,dt*3)+(Math.random()-0.5)*6;
  const pT=s.emg?5.4:(s.lever>=5?0.8*(s.lever-4):0);
  s.manP+=(pT-s.manP)*Math.min(1,dt*1.2);

  /* звук тяги выбранного поезда */
  const snd=s.T.snd;
  let mv=0;
  if(!s.emg&&s.lever<=3&&okTraction&&s.speed<s.T.vmax)mv=0.05+0.05*s.lever/3;
  else if(s.speed>0.3)mv=0.03;
  AU.motor(snd.base+s.speed*snd.slope,snd.base+s.speed*snd.slope+8,mv);
  AU.squeal(((s.lever>=5||s.emg)&&s.speed>0.4&&s.speed<11)?0.055:0);
}
function evaluateStop(dN){
  const s=APP.S,idx=s.stIdx+1,STS=s.LN.stations;
  /* конечная точка — депо: смена завершается */
  if(idx>=STS.length){
    addScore(CONFIG.pts.depot,'ПОДАЧА В ДЕПО');
    showMsg('ПОЕЗД В ДЕПО',3);AU.chime();
    s.phase='end';s.evalT=2.5;s.emg=false;
    return;
  }
  const st=STS[idx];
  if(!st)return;
  const err=-dN,a=Math.abs(err);
  let pts,txt,col;
  if(a<=0.5){pts=5;txt='ОТЛИЧНО!';col='#3dff6e';}
  else if(a<=2){pts=4;txt='ХОРОШО';col='#9dff4f';}
  else if(a<=5){pts=3;txt='НЕПЛОХО';col='#ffe95a';}
  else if(a<=15){pts=1;txt='ГРУБО';col='#ffab4a';}
  else{pts=0;txt=err>0?'ПРОЕЗД СТАНЦИИ':'ОСТАНОВКА РАНО';col='#ff5a5a';}
  s.records.push({name:st.name,err:a,pts,time:s.runT});
  const gain=CONFIG.pts.stop[5-pts];
  if(gain>0)addScore(gain,txt);
  else addScore(CONFIG.pts.noStop,'НЕУСТАНОВКА');
  showMsg(txt,2.5);AU.chime();
  spawnStationPax(idx);
  s.stIdx=idx;
  s.phase='station';
  s.evalT=3.2;s.dwell=CONFIG.dwell;s.emg=false;s.miss=false;
}

/* ==================== РИСОВАНИЕ: ЛИВРЕЯ ВАГОНА ======================= */
function paintLivery(T,x,y0,y1,CW,PX,o){
  o=o||{};const L=T.liv,H=y1-y0;
  const doors=[2.5,8.4,14.3],m=v=>x+v*PX;
  const wins=o.head?[[3.6,3.0],[10.1,2.6]]:[[3.6,3.0],[10.1,2.6],[15.9,2.6]];
  const g=ctx.createLinearGradient(0,y0,0,y1);
  g.addColorStop(0,L.body1);g.addColorStop(0.7,L.body1);g.addColorStop(1,L.body2);
  ctx.fillStyle=g;rr(x+1,y0,CW-2,H,Math.max(3,PX*0.45));ctx.fill();
  ctx.strokeStyle='rgba(0,0,0,0.25)';ctx.lineWidth=1;ctx.stroke();
  if(L.corr){
    ctx.fillStyle='rgba(0,0,0,0.06)';
    for(let sx=x+4;sx<x+CW-4;sx+=Math.max(3,PX*0.4))ctx.fillRect(sx,y0+2,1.5,H-4);
  }
  if(L.top){ctx.fillStyle=L.top;ctx.fillRect(x+2,y0+2,CW-4,Math.max(2,PX*0.28));}
  if(L.band){ctx.fillStyle=L.band;ctx.fillRect(x+2,y0+H*0.66,CW-4,Math.max(3,PX*0.42));}
  ctx.fillStyle=L.skirt;ctx.fillRect(x+2,y1-Math.max(3,PX*0.38),CW-4,Math.max(3,PX*0.38));
  const winCol=o.lights?shade(L.win,1.8):L.win;
  for(const[wo,wl]of wins){
    ctx.fillStyle=winCol;ctx.fillRect(m(wo),y0+H*0.2,wl*PX,H*0.38);
    ctx.fillStyle=L.winTop;ctx.fillRect(m(wo),y0+H*0.2,wl*PX,H*0.1);
    if(o.lights){ctx.fillStyle='rgba(255,240,190,0.25)';ctx.fillRect(m(wo),y0+H*0.2,wl*PX,H*0.06);}
    const h1=hash((o.k||0)*7+wo);
    if(h1<0.75){ctx.fillStyle='rgba(0,0,0,0.55)';
      ctx.beginPath();ctx.arc(m(wo)+2+h1*(wl*PX-4),y0+H*0.42,PX*0.22,0,7);ctx.fill();}
    if(hash((o.k||0)*13+wo)>0.5){ctx.fillStyle='rgba(0,0,0,0.55)';
      ctx.beginPath();ctx.arc(m(wo)+wl*PX-2,y0+H*0.44,PX*0.22,0,7);ctx.fill();}
  }
  for(const dxp of doors){
    ctx.fillStyle='rgba(0,0,0,0.65)';ctx.fillRect(m(dxp)-0.7*PX,y0+H*0.14,1.4*PX,H*0.82);
  }
  const sh=(o.shift||0)*PX*0.65;
  for(const dxp of doors){
    ctx.fillStyle=L.door;
    ctx.fillRect(m(dxp)-0.7*PX-sh,y0+H*0.14,0.7*PX,H*0.82);
    ctx.fillRect(m(dxp)+sh,y0+H*0.14,0.7*PX,H*0.82);
    ctx.fillStyle=L.doorWin;
    ctx.fillRect(m(dxp)-0.55*PX-sh,y0+H*0.22,0.4*PX,H*0.3);
    ctx.fillRect(m(dxp)+0.15*PX+sh,y0+H*0.22,0.4*PX,H*0.3);
    if(o.blink){ctx.fillStyle=((APP.time*5|0)%2)?'#ff4646':'#5a2a2e';
      ctx.fillRect(m(dxp)-1.5,y0-2,3,Math.max(2,PX*0.2));}
  }
  if(L.arcs&&!o.head){
    ctx.strokeStyle='rgba(255,255,255,0.85)';ctx.lineWidth=Math.max(1,PX*0.12);
    for(const lx of[5.4,11.3]){
      ctx.beginPath();ctx.arc(m(lx),y0+H*0.78,PX*0.22,0,7);ctx.stroke();
      ctx.beginPath();ctx.arc(m(lx)+PX*0.55,y0+H*0.78,PX*0.22,0,7);ctx.stroke();
    }
  }
}

      ctx.beginPath();ctx.arc(m(17.75),y1-PX*0.8,PX*0.22,0,7);ctx.fill();

      ctx.beginPath();ctx.arc(m(18.9),y1-PX*0.9,PX*1.3,0,7);ctx.fill();
    }
    ctx.fillStyle='#ff4040';ctx.fillRect(m(17.9),y0+H*0.06,PX*0.4,PX*0.2);
  }
}

function meter(x,y,r,val,max,label,redFrom){
  ctx.fillStyle='#e8e6df';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle='#0a0e24';ctx.stroke();
  for(let i=0;i<=10;i++){
    const a=(-210+i*24)*Math.PI/180,l=i%5===0?9:5;
    ctx.strokeStyle='#222';ctx.lineWidth=i%5===0?2:1;
    ctx.beginPath();
    ctx.moveTo(x+Math.cos(a)*(r-4),y+Math.sin(a)*(r-4));
    ctx.lineTo(x+Math.cos(a)*(r-4-l),y+Math.sin(a)*(r-4-l));ctx.stroke();
  }
  const a0=(-210+redFrom/max*240)*Math.PI/180;
  ctx.strokeStyle='#c22222';ctx.lineWidth=4;
  ctx.beginPath();ctx.arc(x,y,r-9,a0,Math.PI/6);ctx.stroke();
  ctx.fillStyle='#333';ctx.font='9px Arial';ctx.textAlign='center';
  for(let i=0;i<=4;i++){
    const a=(-210+i*60)*Math.PI/180;
    ctx.fillText(max*i/4,x+Math.cos(a)*(r-24),y+Math.sin(a)*(r-24)+3);
  }
  const av=(-210+clamp(val/max,0,1)*240)*Math.PI/180;
  ctx.strokeStyle='#a02020';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(x-Math.cos(av)*10,y-Math.sin(av)*10);
  ctx.lineTo(x+Math.cos(av)*(r-14),y+Math.sin(av)*(r-14));ctx.stroke();
  ctx.fillStyle='#333';ctx.beginPath();ctx.arc(x,y,4,0,7);ctx.fill();
  ctx.fillStyle='#9fb0d8';ctx.font='10px Arial';ctx.fillText(label,x,y+r+14);

function ledData(){
  const s=APP.S,d=s.door,STS=s.LN.stations,nx=STS[s.stIdx+1],st=STS[s.stIdx];
  const bl=((APP.time*1.6)|0)%2===0;
  let l1='',l2='';
  if(s.msgT>0)l1=s.msg;
  else if(s.phase==='ready'){l1=bl?'ПОДАЧА ИЗ ДЕПО - ПУСК ЗАПИСИ':'';l2='ЛИНИЯ '+s.LN.num+' - '+s.LN.name;}
  else if(s.phase==='end'){l1='ПОЕЗД В ДЕПО';l2=st.name;}
  else if(s.phase==='station'){
    if(d.state==='open'){l1='ПОСАДКА ПАССАЖИРОВ';
      l2=s.dwell>0?'ОТПР. ЧЕРЕЗ '+Math.max(0,Math.ceil(s.dwell))+' С':'ОТПРАВЛЯЙТЕСЬ';}
    else if(d.state==='warn'){l1=bl?'ВНИМАНИЕ - ДВЕРИ ЗАКРЫВАЮТСЯ':'';l2=st.name;}
    else if(d.state==='closing'&&d.stuck){l1=bl?'ПАССАЖИР В ДВЕРЯХ':'';l2='ОСТОРОЖНО';}
    else if(d.state==='closing'){l1='ДВЕРИ ЗАКРЫВАЮТСЯ';l2=st.name;}
    else if(!s.blocked){l1=bl?'ЗАБЛОКИРУЙТЕ ДВЕРИ':'';l2=st.name+' ОТПР.';}
    else{l1=st.name+' ОТПР.';l2='В ПУТЬ!';}
  }else if(s.phase==='run'){
    const dN=distNext();
    if(s.emg){l1='ЭКСТРЕННОЕ ТОРМОЖЕНИЕ';l2='';}
    else if(s.failPen){l1='НЕУСТАНОВКА';l2='ПОДЪЕДЬТЕ К ЗНАКУ';}
    else if(s.miss){l1='ПРОЕЗД СТАНЦИИ';l2='ОСТАНОВИТЕСЬ';}
    else if(!nx){l1='СЛЕДУЙТЕ В ДЕПО';l2='ОСТАНОВКА У ЗНАКА «ДЕПО»';}
    else if(dN<600*CONFIG.distScale){l1=bl?'СТАНЦИЯ '+nx.name:'';
      l2='ВЫХОД '+(nx.side==='right'?'НАПРАВО':'НАЛЕВО')+' - ТОРМОЗИТЕ';}
    else{l1='СЛЕДУЮЩАЯ СТАНЦИЯ '+nx.name+'   ';
      l2='СКОРОСТЬ '+Math.round(s.speed*3.6)+' КМ/Ч';}
  }
  return{l1,l2};
}

function finalScore(){
  const s=APP.S;let sum=0,max=0;
  for(const r of s.records){sum+=r.pts;max+=5;}
  const pen=s.wrongSidePen+s.missPen*2+s.rough*0.25;
  const pct=clamp(100*sum/Math.max(1,max)-pen*5,0,100);
  let grade;
  if(pct>=90)grade='МАШИНИСТ 1 КЛАССА';
  else if(pct>=75)grade='МАШИНИСТ 2 КЛАССА';
  else if(pct>=60)grade='МАШИНИСТ 3 КЛАССА';
  else if(pct>=40)grade='ПОМОЩНИК МАШИНИСТА';
  else grade='СТАЖЁР';
  return{sum,max,pen,pct,grade};
}

      ctx.fillText('МОСКВА',hx+3.4*PX,y0+PX*2.6);
    }
  }else{
    ctx.fillStyle='#9aa0a7';rr(hx+17.55*PX,y0+PX*0.2,1.4*PX,(y1-y0)-PX*0.4,PX*0.3);ctx.fill();
    ctx.fillStyle='#22282f';rr(hx+17.8*PX,y0+PX*0.5,0.9*PX,PX*1.1,2);ctx.fill();
  }
  ctx.fillStyle='#fff6d8';
  ctx.beginPath();ctx.arc(hx+18.3*PX,y1-PX*0.35,PX*0.2,0,7);ctx.fill();
}
function lineBadge(x,y,r,lid,sel){
  const L=LINES[lid];
  HOT.push({x:x-r-6,y:y-r-6,w:2*(r+6),h:2*(r+6),id:'line_'+lid});
  ctx.beginPath();ctx.arc(x,y,r,0,7);
  ctx.fillStyle=L.color;ctx.fill();
  ctx.lineWidth=sel?3.5:1.5;
  ctx.strokeStyle=sel?'#fff':'rgba(255,255,255,0.25)';
  ctx.stroke();
  ctx.fillStyle=L.numCol;ctx.font='bold 17px Arial';ctx.textAlign='center';
  ctx.fillText(L.num,x,y+r*0.55);
}
function arrowBtn(x,y,id,ch,dis){
  HOT.push({x,y,w:30,h:30,id:dis?null:id});
  rr(x,y,30,30,6);
  ctx.fillStyle=dis?'#1a2040':(APP.hover===id?'#ffe066':'#2a3560');ctx.fill();
  ctx.strokeStyle=dis?'#232a4a':'#4a5680';ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle=dis?'#3a4468':'#e8ecf4';
  ctx.font='bold 18px Arial';ctx.textAlign='center';
  ctx.fillText(ch,x+15,y+21);
}

    ctx.fillText(T.name,x+w/2,y+140);
    ctx.fillStyle='#7c88ad';ctx.font='11px Arial';

    ctx.fillStyle='#9fb0d8';ctx.font='12px Arial';

  }
  btnUI(440,520,400,66,'НАЧАТЬ СМЕНУ','start');
  ctx.textAlign='center';ctx.fillStyle='#5a6690';ctx.font='11px Arial';
  ctx.fillText('Смена: выезд из депо → все станции маршрута → возврат в депо',640,620);
  if(APP.rules)drawRulesOv();
}

/* ==================== РЕНДЕР ========================================= */
function render(){
  HOT.length=0;
  if(APP.screen==='menu'){drawMenu();return;}
  const s=APP.S;
  drawScene();
  drawConsole();
  if(s.phase==='ready'&&!s.rec)drawStartHint();
  if(APP.help)drawHelpPanel();
  if(APP.paused)drawPauseOv();
  if(s.phase==='results')drawResults();
}
function drawStartHint(){
  const s=APP.S,STS=s.LN.stations;
  rr(330,40,620,200,12);ctx.fillStyle='rgba(7,11,28,0.93)';ctx.fill();
  ctx.strokeStyle='#ffd23f';ctx.lineWidth=2;ctx.stroke();
  ctx.textAlign='center';
  ctx.fillStyle='#ffd23f';ctx.font='bold 24px Arial';
  ctx.fillText(s.T.name.toUpperCase()+' • ЛИНИЯ '+s.LN.num,640,88);
  ctx.fillStyle='#9fb0d8';ctx.font='13px Arial';
  ctx.fillText('Маршрут: '+STS[0].name+' → '+STS[STS.length-1].name+
    '. Поезд подан из депо — 1200 м до '+STS[0].name+'.',640,122);
  ctx.fillText('АРС нет, ЭТ без штрафа. +50/+40/+30 за установку у знака.',640,144);
  ctx.fillText('После конечной станции — возврат в депо (знак «ДЕПО», +30).',640,164);
  if(((APP.time*1.6)|0)%2){ctx.fillStyle='#3dff6e';ctx.font='bold 15px Arial';
    ctx.fillText('НАЖМИТЕ «ПУСК ЗАПИСИ» ИЛИ ENTER',640,200);}
}

/* ==================== ВВОД =========================================== */
const HOT=[];
function toG(e){const r=cv.getBoundingClientRect();
  return{x:(e.clientX-r.left)*1280/r.width,y:(e.clientY-r.top)*720/r.height};}
function hit(p){
  for(let i=HOT.length-1;i>=0;i--){
    const h=HOT[i];
    if(h&&p.x>=h.x&&p.x<=h.x+h.w&&p.y>=h.y&&p.y<=h.y+h.h)return h.id;
  }
  return null;
}
function gameBtn(id){
  const s=APP.S;
  switch(id){
    case 'L':openDoors('left');break;
    case 'R':openDoors('right');break;
    case 'C':closeDoors();break;
    case 'B':blockDoors();break;
    case 'REC':startRec();break;
    case 'HORN':AU.hornStart();APP.hornOn=true;break;
    case 'EMG':emgToggle();break;
    case 'MUTE':toggleMute();break;
    case 'LIGHT':s.lights=!s.lights;AU.beep(600,0.08,'sine',0.1);break;
    case 'HEADS':s.heads=!s.heads;AU.beep(500,0.08,'sine',0.1);break;
  }
}
function toggleDir(){
  APP.sel.dir=(APP.sel.dir==='rev')?'fwd':'rev';
  AU.beep(600,0.06,'sine',0.1);
}
function clickId(id){
  if(!id)return;
  AU.init();
  if(APP.screen==='menu'){
    if(id==='rules')APP.rules=!APP.rules;
    else if(id==='closeRules')APP.rules=false;
    else if(id==='dir_prev'||id==='dir_next')toggleDir();
    else if(id.startsWith('line_')){APP.sel.line=id.slice(5);AU.beep(700,0.06,'sine',0.1);}
    else if(id.startsWith('train_')){APP.sel.train=id.slice(6);AU.beep(700,0.06,'sine',0.1);}
    else if(id==='start')startGame();
    return;
  }
  if(id==='resume'){APP.paused=false;return;}
  if(id==='gomenu'){toMenu();return;}
  if(id==='restart'){restartGame();return;}
  if(id==='PAUSE'){APP.paused=!APP.paused;if(APP.paused)AU.silence();return;}
  if(id==='HELP'){APP.help=!APP.help;return;}
  if(id==='MENU'){toMenu();return;}
  if(APP.paused||APP.help)return;
  if(APP.S.phase!=='results')gameBtn(id);
}
cv.addEventListener('pointerdown',e=>{
  AU.init();
  const p=toG(e);
  if(APP.screen==='game'&&!APP.paused&&APP.S.phase!=='results'&&
     Math.abs(p.x-344)<32&&p.y>368&&p.y<692){
    setLeverY(p.y);dragLever=true;return;
  }
  clickId(hit(p));
});
addEventListener('pointermove',e=>{
  const p=toG(e);
  if(APP.screen==='game'&&dragLever){setLeverY(p.y);return;}
  APP.hover=hit(p);
  cv.style.cursor=APP.hover?'pointer':'default';
});
addEventListener('pointerup',()=>{
  dragLever=false;
  if(APP.hornOn){AU.hornStop();APP.hornOn=false;}
});
addEventListener('keydown',e=>{
  AU.init();
  if(APP.screen==='menu'){
    if(e.code==='Escape')APP.rules=false;
    if(e.code==='ArrowLeft'||e.code==='ArrowRight')toggleDir();
    if(e.code==='Enter'&&!APP.rules)startGame();
    return;
  }
  const s=APP.S;if(!s)return;
  if(s.phase==='results'){
    if(e.code==='Enter')restartGame();
    if(e.code==='Escape')toMenu();
    return;
  }
  switch(e.code){
    case 'ArrowUp':case 'KeyW':e.preventDefault();if(!e.repeat&&!APP.paused)changeLeverTo(s.lever-1);break;
    case 'ArrowDown':case 'KeyS':e.preventDefault();if(!e.repeat&&!APP.paused)changeLeverTo(s.lever+1);break;
    case 'KeyA':case 'ArrowLeft':if(!e.repeat&&!APP.paused)openDoors('left');break;
    case 'KeyD':case 'ArrowRight':if(!e.repeat&&!APP.paused)openDoors('right');break;
    case 'KeyC':if(!e.repeat&&!APP.paused)closeDoors();break;
    case 'KeyB':if(!e.repeat&&!APP.paused)blockDoors();break;
    case 'Enter':if(!e.repeat&&!APP.paused)startRec();break;
    case 'Space':e.preventDefault();if(!e.repeat&&!APP.paused){AU.hornStart();APP.hornOn=true;}break;
    case 'KeyE':if(!e.repeat&&!APP.paused)emgToggle();break;
    case 'KeyL':if(!e.repeat&&!APP.paused)s.lights=!s.lights;break;
    case 'KeyH':if(!e.repeat&&!APP.paused)s.heads=!s.heads;break;
    case 'Escape':if(!e.repeat){APP.paused=!APP.paused;if(APP.paused)AU.silence();}break;
    case 'KeyM':if(!e.repeat)toggleMute();break;
  }
});
addEventListener('keyup',e=>{
  if(e.code==='Space'&&APP.hornOn){AU.hornStop();APP.hornOn=false;}
});
addEventListener('blur',()=>{if(APP.hornOn){AU.hornStop();APP.hornOn=false;}});

/* ==================== ГЛАВНЫЙ ЦИКЛ =================================== */
let last=0;
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(t-last)/1000||0);last=t;
  APP.time+=dt;
  try{
    if(APP.screen==='game'&&!APP.paused)update(dt);
  }catch(e){
    if(APP.S){APP.S.speed=0;APP.S.accel=0;}
  }
  render();
}
requestAnimationFrame(frame);

/* ==== PWA: регистрация офлайн-кэша (работает только на https) ==== */
if(location.protocol.indexOf('http')===0&&'serviceWorker' in navigator){
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
